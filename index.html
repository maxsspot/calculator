<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.5.1/math.js"></script>
        <link rel = "stylesheet" href = "index.css">
        <title>Calculator</title>
    </head>
    <body onload = "buttonsWork()">
        <br><br>
            <input id = "calculations" readonly />
        <br>
        <div id = "extraKeys"><br>
            <div class = "row">
                <button class = "functionButton">sqrt(</button>
                <button class = "functionButton">sin(</button>
                <button class = "functionButton">cos(</button>
                <button class = "functionButton">tan(</button>
            </div>
            <div class = "row">
                <button class = "functionButton">^</button>
                <button class = "functionButton" id = "leftParen">(</button>
                <button class = "functionButton" id = "rightParen">)</button>
                <button class = "functionButton">DEL</button>
                <button class = "functionButton">C</button>
            </div>
        </div><br><br><br><br><br>
        <div class = "row">
            <button class = "numericalButton">7</button>
            <button class = "numericalButton">8</button>
            <button class = "numericalButton">9</button>
            <button class = "functionButton">/</button>
        </div>
        <div class = "row">
            <button class = "numericalButton">4</button>
            <button class = "numericalButton">5</button>
            <button class = "numericalButton">6</button>
            <button class = "functionButton">*</button>
        </div>
        <div class = "row">
            <button class = "numericalButton">1</button>
            <button class = "numericalButton">2</button>
            <button class = "numericalButton">3</button>
            <button class = "functionButton">-</button>
        </div>
        <div class = "row">
            <button class = "numericalButton">0</button>
            <button class = "numericalButton">.</button>
            <button class = "equalButton">=</button>
            <button class = "functionButton">+</button>
        </div>
        <span id = "extraKeysControls">Show Extra Keys ▼</span>
        <script src = "index.js"></script>
    </body>
</html>
